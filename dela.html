<style>
/* Layout: photo fixed behind everything; title on the photo; one frosted panel holds progress, list, add-row, history */
:root{
  --base:#3a2a22;
  --panel:rgba(255,248,238,.80); --fg:#2b1d16; --muted:#7a6556; --line:rgba(90,60,40,.14);
  --accent:#b06e2c; --on-accent:#fff8ee; --done:#a8978a; --err:#b3261e;
  --p1:#c8463b; --p2:#e08a2c; --p3:#9c8f86;
  --field:rgba(255,255,255,.65); --veil:rgba(30,18,12,.18);
  --title:#fff6ea; --panel-solid:#fbf3e8; --glow:rgba(224,138,44,.22);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --panel:rgba(32,22,17,.74); --fg:#f5ebe0; --muted:#bba797; --line:rgba(255,235,210,.13);
  --accent:#e3a75c; --on-accent:#2b1d16; --done:#857469; --err:#ff8a80;
  --p1:#ef6a5d; --p2:#eea24a; --p3:#a39689;
  --field:rgba(255,240,225,.08); --veil:rgba(10,6,4,.45); --panel-solid:#2c1f19; --glow:rgba(238,162,74,.22);
  color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--base)}
body{margin:0;color:var(--fg);font-family:var(--font);font-size:16px;background:transparent;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:calc(100lvh + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));z-index:-3;background:var(--base) url("dela-bg.jpg") center 30%/cover no-repeat}
body::after{content:"";position:fixed;top:0;left:0;right:0;height:calc(100lvh + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));z-index:-1;background:linear-gradient(180deg,rgba(20,12,8,.35) 0%,var(--veil) 35%,var(--veil) 100%)}
[hidden]{display:none!important}
.topbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;pointer-events:none;
  background:rgba(30,18,12,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.filt{display:flex;flex-wrap:wrap;gap:6px}
.filt button{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);
  background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.filt button[data-f]:not([data-f="0"])::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.filt button[data-f="1"]{--pc:var(--p1)} .filt button[data-f="2"]{--pc:var(--p2)} .filt button[data-f="3"]{--pc:var(--p3)}
.filt button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--panel-solid);font-weight:600}
.filt small{font-size:12px;opacity:.7}
.field{position:relative;flex:1 1 0;min-width:0;display:flex}
form.add{flex-wrap:nowrap}
form.add .btn{flex:none}
.field .dot{position:absolute;left:8px;top:50%;transform:translateY(-50%)}
.field input.text{flex:1;padding-left:44px}
.field .pmenu{left:40px}
.photo{display:none}
/* широкий экран: фото в своих пропорциях по центру, края растворяются в размытом фоне */
@media (min-width:700px) and (min-aspect-ratio:4/5){
  body::before{filter:blur(40px) brightness(.75);transform:scale(1.15)}
  .photo{display:block;position:fixed;top:0;bottom:0;left:50%;z-index:-2;height:100vh;width:calc(100vh * 900 / 1310);transform:translateX(-50%);
    background:url("dela-bg.jpg") center/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
}
.wrap{max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:4px;margin:0 4px}
.today{font-size:15px;font-weight:500;color:var(--title);opacity:.85;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.today::first-letter{text-transform:uppercase}
.hempty{margin:10px 0 2px;font-size:13px;color:var(--muted)}
h1{font-size:34px;font-weight:700;margin:0;color:var(--title);letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 18px rgba(0,0,0,.45)}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 10px 40px rgba(20,10,5,.25)}
.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;line-height:1.35}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.txt{display:flex;flex-direction:column;min-width:0}
.txt span{overflow-wrap:anywhere}
.txt small{font-size:12px;color:var(--muted);margin-top:2px}
li.done .txt span{color:var(--done);text-decoration:line-through}
li.empty{color:var(--muted)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;font:inherit}
.dot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--pc)}
.dot[data-p="1"]{--pc:var(--p1)} .dot[data-p="2"]{--pc:var(--p2)} .dot[data-p="3"]{--pc:var(--p3)}
.dot:disabled{cursor:default}
li.done .dot::before{opacity:.35}
.dot:not(:disabled):hover,.dot[aria-expanded="true"]{background:var(--line)}
li{position:relative}
.pmenu{position:absolute;left:36px;top:50%;transform:translateY(-50%);z-index:5;display:flex;gap:4px;padding:5px;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(20,10,5,.25)}
.pmenu button{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:none;
  color:var(--fg);font:inherit;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums}
.pmenu button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--pc)}
.pmenu button[data-p="1"]{--pc:var(--p1)} .pmenu button[data-p="2"]{--pc:var(--p2)} .pmenu button[data-p="3"]{--pc:var(--p3)}
.pmenu button[aria-checked="true"]{background:var(--line);font-weight:700}
li.flash{animation:flash 1.6s ease-out;border-radius:10px}
@keyframes flash{0%,40%{background:var(--glow);box-shadow:0 0 0 8px var(--glow)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none}
.del:hover{background:var(--line);color:var(--fg)}
form.add{display:flex;flex-wrap:wrap;gap:8px}
input.text{flex:1 1 220px;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg)}
input.text::placeholder{color:var(--muted)}
.btn{font:inherit;font-weight:600;padding:0 18px;min-height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.link{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.note.err{color:var(--err)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.access{display:flex;flex-direction:column;gap:10px}
.access input.text{flex:none}
body.locked .meta,body.locked #filt,body.locked #list,body.locked #add,body.locked #hist,body.locked #editToggle{display:none!important}
body.locked .access{display:flex!important}
body.locked .note:empty{display:none}
.access p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
details.hist{border-top:1px solid var(--line);padding-top:12px}
details.hist summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary::before{content:"›";display:inline-block;transition:transform .2s;font-size:18px;line-height:1}
details.hist[open] summary::before{transform:rotate(90deg)}
.day{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.day + .hrow{border-top:0}
.hrow span{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--done)}
.hrow small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.back{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:5px 10px;cursor:pointer}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;align-self:center;border:2px solid var(--line)}
.splash{position:fixed;top:0;left:0;right:0;height:calc(100lvh + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));z-index:50;display:grid;place-items:center;background:var(--base) url("dela-bg.jpg") center 30%/cover no-repeat;transition:opacity .5s ease}
.splash::after{content:"";position:absolute;inset:0;background:rgba(20,12,8,.35)}
.splash span{position:relative;z-index:1;font-size:40px;font-weight:700;color:var(--title);text-shadow:0 2px 24px rgba(0,0,0,.5)}
.splash.out{opacity:0;pointer-events:none}
.wrap header,.panel{transition:opacity .6s ease}
body.celebrate .wrap header,body.celebrate .panel{opacity:0;pointer-events:none}
.yay{position:fixed;top:0;left:0;right:0;height:calc(100lvh + env(safe-area-inset-top,0px) + env(safe-area-inset-bottom,0px));z-index:40;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s ease .3s}
.yay div{text-align:center;color:var(--title);text-shadow:0 2px 24px rgba(0,0,0,.55)}
.yay b{display:block;font-size:42px;font-weight:700}
.yay small{display:block;margin-top:6px;font-size:16px;opacity:.85}
body.celebrate .yay{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.bar i,details.hist summary::before,.splash,.wrap header,.panel,.yay{transition:none}li.flash{animation:none}}
</style>
</head>
<body>
<div class="photo" aria-hidden="true"></div>
<div class="topbar" aria-hidden="true"></div>
<div class="splash" id="splash" hidden><span>Дела двоих</span></div>
<script>try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.getElementById('splash').hidden=false}catch(e){}</script>
<div class="yay" id="yay" aria-live="polite"><div><b>Всё сделано</b><small>Все дела из списка выполнены</small></div></div>
<div class="wrap">
  <header><span class="today" id="today"></span><h1>Дела двоих</h1></header>
  <div class="panel">
    <div class="meta"><span id="count">Загружаю…</span><div class="bar"><i id="fill"></i></div></div>
    <div class="filt" id="filt" role="group" aria-label="Показать дела">
      <button type="button" data-f="0" aria-pressed="true">Все</button>
      <button type="button" data-f="1" aria-pressed="false" aria-label="Приоритет 1">1 <small id="fc1"></small></button>
      <button type="button" data-f="2" aria-pressed="false" aria-label="Приоритет 2">2 <small id="fc2"></small></button>
      <button type="button" data-f="3" aria-pressed="false" aria-label="Приоритет 3">3 <small id="fc3"></small></button>
    </div>
    <ul id="list"><li class="empty">Загружаю список…</li></ul>
    <form class="add" id="add" hidden>
      <div class="field" id="field">
        <button type="button" class="dot" id="newDot" data-p="2" aria-haspopup="true" aria-expanded="false" aria-label="Приоритет нового дела: 2"></button>
        <input class="text" id="newItem" placeholder="Новое дело" autocomplete="off">
      </div>
      <button class="btn" id="addBtn">Добавить</button>
    </form>
    <details class="hist" id="hist" hidden>
      <summary id="histSum">История</summary>
      <div id="histBody"></div>
    </details>
    <div class="foot">
      <p class="note" id="note"></p>
      <button class="link" id="editToggle" type="button">Редактировать</button>
    </div>
    <form class="access" id="access" hidden>
      <img class="ava" src="dela-avatar.jpg" alt="" width="64" height="64">
      <p>Введите PIN-код, чтобы открыть список. Он запомнится на этом устройстве.</p>
      <input class="text" id="token" type="password" inputmode="numeric" placeholder="PIN-код" autocomplete="off">
      <button class="btn" type="submit">Открыть</button>
    </form>
  </div>
</div>
<script>
(function(){
  // Адрес веб-приложения Google Apps Script (хранилище отметок)
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4kNsjbkiusLKdHOoGNP1GB4U-jsGajH6DtypqD1pBewGALReMMHd_gmMXHj4NCjJgoQ/exec';
  var KEY = 'dela-pin';
  var state = { items: [], history: [] }, pin = '', loaded = false, busy = 0, filter = 0, newP = 2;
  try { filter = Number(localStorage.getItem('dela-filter')) || 0; } catch(e) {}
  var $ = function(id){ return document.getElementById(id); };
  try { pin = localStorage.getItem(KEY) || ''; } catch(e) {}

  function setNote(t, err){ $('note').textContent = t; $('note').className = err ? 'note err' : 'note'; }
  function canEdit(){ return !!pin && loaded && !!SCRIPT_URL; }
  function pr(x){ return [1,2,3].indexOf(Number(x.p)) >= 0 ? Number(x.p) : 2; }

  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function hm(d){ return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  function dayKey(d){ return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(d){
    var now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
    if (dayKey(d) === dayKey(now)) return 'Сегодня';
    if (dayKey(d) === dayKey(y)) return 'Вчера';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : '');
  }
  function doneLabel(at){
    var d = new Date(at), l = dayLabel(d);
    return 'сделано ' + (l === 'Сегодня' ? 'сегодня' : l === 'Вчера' ? 'вчера' : l) + ' в ' + hm(d);
  }

  function sorted(){
    var idx = state.items.map(function(x, i){ return { x: x, i: i }; });
    idx.sort(function(a, b){
      if (a.x.d !== b.x.d) return a.x.d ? 1 : -1;
      if (a.x.d) return (b.x.at || 0) - (a.x.at || 0);
      return pr(a.x) - pr(b.x) || a.i - b.i;
    });
    return idx.map(function(o){ return o.x; });
  }

  function render(){
    if (openM && openM.dot.id !== 'newDot') openM = null;
    var list = $('list'); list.textContent = '';
    var edit = canEdit(), all = sorted();
    var items = filter ? all.filter(function(x){ return pr(x) === filter; }) : all;
    if (!items.length && loaded) {
      var e = document.createElement('li'); e.className = 'empty';
      e.textContent = filter ? 'Нет дел с приоритетом ' + filter + '.' : 'Все дела сделаны. Добавьте новое.'; list.append(e);
    }
    items.forEach(function(it, i){
      var li = document.createElement('li'); if (it.d) li.className = 'done'; li.dataset.key = it.t;
      if (flash.key === it.t && Date.now() - flash.at < 1600) { li.classList.add('flash'); li.style.animationDelay = -(Date.now() - flash.at) + 'ms'; }
      var dot = document.createElement('button'); dot.type = 'button'; dot.className = 'dot'; dot.dataset.p = pr(it);
      dot.setAttribute('aria-label', 'Приоритет ' + pr(it) + (edit ? ', нажмите, чтобы изменить' : ''));
      dot.disabled = !edit;
      dot.setAttribute('aria-haspopup', 'true'); dot.setAttribute('aria-expanded', 'false');
      dot.addEventListener('click', function(ev){
        ev.stopPropagation();
        openMenu(li, dot, pr(it), function(n){ it.p = n; moveWithFlip(it.t); send({ action: 'prio', t: it.t, p: n }); });
      });
      var lab = document.createElement('label');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'c' + i; cb.checked = !!it.d; cb.disabled = !edit;
      cb.addEventListener('change', function(){
        it.d = cb.checked; it.at = cb.checked ? Date.now() : null; render();
        if (cb.checked && state.items.length && state.items.every(function(x){ return x.d; })) celebrate();
        send({ action: 'toggle', t: it.t, d: cb.checked });
      });
      var tx = document.createElement('div'); tx.className = 'txt';
      var sp = document.createElement('span'); sp.textContent = it.t; tx.append(sp);
      if (it.d && it.at) { var sm = document.createElement('small'); sm.textContent = doneLabel(it.at); tx.append(sm); }
      lab.append(cb, tx);
      li.append(dot, lab);
      if (edit) {
        var del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = '×';
        del.setAttribute('aria-label', 'Удалить «' + it.t + '»');
        del.addEventListener('click', function(){
          state.items = state.items.filter(function(x){ return x !== it; }); render();
          send({ action: 'remove', t: it.t });
        });
        li.append(del);
      }
      list.append(li);
    });
    var n = state.items.length, d = state.items.filter(function(x){ return x.d; }).length;
    if (loaded) $('count').textContent = 'Сделано ' + d + ' из ' + n;
    $('fill').style.width = (n ? d / n * 100 : 0) + '%';
    $('add').hidden = !edit;
    document.body.classList.toggle('locked', !pin);
    $('editToggle').hidden = !pin;
    $('editToggle').textContent = 'Выйти';
    renderHistory(edit);
    renderToday();
    renderFilter();
  }

  function renderFilter(){
    [1, 2, 3].forEach(function(n){
      var c = state.items.filter(function(x){ return !x.d && pr(x) === n; }).length;
      $('fc' + n).textContent = c ? c : '';
    });
    document.querySelectorAll('#filt button').forEach(function(b){
      b.setAttribute('aria-pressed', Number(b.dataset.f) === filter ? 'true' : 'false');
    });
  }
  document.querySelectorAll('#filt button').forEach(function(b){
    b.addEventListener('click', function(){
      var f = Number(b.dataset.f); filter = (filter === f && f) ? 0 : f;
      try { localStorage.setItem('dela-filter', String(filter)); } catch(e) {}
      render();
    });
  });

  // меню приоритета у точки
  var openM = null, flash = { key: null, at: 0 };
  function closeMenu(){
    if (!openM) return;
    openM.menu.remove(); openM.dot.setAttribute('aria-expanded', 'false'); openM = null;
  }
  function openMenu(li, dot, cur, pick){
    var same = openM && openM.dot === dot; closeMenu(); if (same) return;
    var m = document.createElement('div'); m.className = 'pmenu'; m.setAttribute('role', 'menu');
    [1, 2, 3].forEach(function(n){
      var b = document.createElement('button'); b.type = 'button'; b.dataset.p = n; b.textContent = n;
      b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', cur === n ? 'true' : 'false');
      b.setAttribute('aria-label', 'Приоритет ' + n);
      b.addEventListener('click', function(ev){
        ev.stopPropagation(); closeMenu();
        if (cur !== n) pick(n);
      });
      m.append(b);
    });
    li.append(m); dot.setAttribute('aria-expanded', 'true');
    openM = { menu: m, dot: dot };
    var sel = m.querySelector('[aria-checked="true"]'); if (sel) sel.focus({ preventScroll: true });
  }
  document.addEventListener('click', function(e){ if (openM && !openM.menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && openM) { var d = openM.dot; closeMenu(); d.focus(); } });

  // плавный переезд дела на новое место и подсветка
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rects(){
    var r = {}; document.querySelectorAll('#list li[data-key]').forEach(function(li){ r[li.dataset.key] = li.getBoundingClientRect().top; }); return r;
  }
  function moveWithFlip(key){
    var before = rects(); render();
    var target = null;
    document.querySelectorAll('#list li[data-key]').forEach(function(li){
      if (li.dataset.key === key) target = li;
      if (reduce) return;
      var dy = (before[li.dataset.key] || 0) - li.getBoundingClientRect().top;
      if (!dy || before[li.dataset.key] === undefined) return;
      li.style.transform = 'translateY(' + dy + 'px)'; li.style.transition = 'none';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        li.style.transition = 'transform .45s cubic-bezier(.2,.7,.2,1)'; li.style.transform = '';
      }); });
    });
    if (target) {
      flash = { key: key, at: Date.now() }; target.classList.add('flash');
      setTimeout(function(){ target.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }, reduce ? 0 : 460);
    }
  }

  var yayT = null;
  function celebrate(){
    document.body.classList.add('celebrate');
    clearTimeout(yayT); yayT = setTimeout(endCelebrate, 3200);
  }
  function endCelebrate(){ clearTimeout(yayT); document.body.classList.remove('celebrate'); }
  $('yay').addEventListener('click', endCelebrate);

  // заставка при запуске с экрана «Домой»
  var splashStart = Date.now(), splashDone = false;
  function hideSplash(){
    if (splashDone) return; splashDone = true;
    var sp = $('splash'); if (sp.hidden) return;
    setTimeout(function(){ sp.classList.add('out'); setTimeout(function(){ sp.hidden = true; }, 600); }, Math.max(0, 900 - (Date.now() - splashStart)));
  }
  setTimeout(hideSplash, 3000);

  var WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
  function renderToday(){
    var d = new Date();
    $('today').textContent = WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  function renderHistory(edit){
    var h = state.history || [];
    $('hist').hidden = !edit;
    if ($('hist').hidden) return;
    $('histSum').textContent = 'История · ' + h.length;
    var body = $('histBody'); body.textContent = '';
    if (!h.length) {
      var em = document.createElement('p'); em.className = 'hempty';
      em.textContent = 'Здесь появятся дела через сутки после выполнения.'; body.append(em);
    }
    var last = '';
    h.forEach(function(it){
      var d = new Date(it.at), k = dayKey(d);
      if (k !== last) {
        var dl = document.createElement('div'); dl.className = 'day'; dl.textContent = dayLabel(d); body.append(dl); last = k;
      }
      var row = document.createElement('div'); row.className = 'hrow';
      var sp = document.createElement('span'); sp.textContent = it.t;
      var tm = document.createElement('small'); tm.textContent = hm(d);
      var bk = document.createElement('button'); bk.type = 'button'; bk.className = 'back'; bk.textContent = 'Вернуть';
      bk.setAttribute('aria-label', 'Вернуть «' + it.t + '» в список');
      bk.addEventListener('click', function(){
        state.history = state.history.filter(function(x){ return x !== it; });
        state.items.push({ t: it.t, d: false, at: null, p: it.p }); render();
        send({ action: 'restore', t: it.t });
      });
      row.append(sp, tm, bk); body.append(row);
    });
  }

  function apply(j){
    state = { items: j.items || [], history: j.history || (canEdit() ? state.history : []) };
    loaded = true;
  }

  function post(body){
    return fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function refresh(quiet){
    if (busy) return;
    if (!pin) { state = { items: [], history: [] }; loaded = false; render(); hideSplash(); return; }
    post({ action: 'check', pin: pin }).then(function(j){
      if (busy) return;
      if (j.ok === false && j.error === 'bad_pin') { forget(); return refresh(quiet); }
      apply(j); render(); hideSplash();
      if (!quiet) setNote('Отметки видят все, у кого есть PIN.');
    }).catch(function(){ hideSplash(); if (!quiet) setNote('Не удалось загрузить список. Проверьте интернет и обновите страницу.', true); });
  }

  function send(body){
    body.pin = pin; busy++; setNote('Сохраняю…');
    post(body).then(function(j){
      if (!j.ok && j.error === 'bad_pin') { forget(); setNote('PIN не подошёл. Нажмите «Редактировать» и введите его снова.', true); return; }
      if (!j.ok) throw new Error(j.error || 'ошибка');
      if (busy === 1) apply(j);
      setNote('Сохранено.');
    }).catch(function(e){
      setNote('Не удалось сохранить (' + (e && e.message || e) + '). Попробуйте ещё раз.', true);
    }).then(function(){ busy--; render(); if (!busy) refresh(true); });
  }

  function forget(){ pin = ''; state = { items: [], history: [] }; loaded = false; try { localStorage.removeItem(KEY); } catch(e) {} render(); }

  $('add').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('newItem').value.trim(); if (!v) return;
    var p = newP;
    $('newItem').value = ''; setNewP(2);
    if (filter && filter !== p) { filter = 0; try { localStorage.setItem('dela-filter', '0'); } catch(e2) {} }
    if (!state.items.some(function(x){ return x.t === v; })) { state.items.push({ t: v, d: false, at: null, p: p }); render(); }
    send({ action: 'add', t: v, p: p });
  });

  function setNewP(n){
    newP = n; var d = $('newDot'); d.dataset.p = n; d.setAttribute('aria-label', 'Приоритет нового дела: ' + n);
  }
  $('newDot').addEventListener('click', function(ev){
    ev.stopPropagation();
    openMenu($('field'), $('newDot'), newP, function(n){ setNewP(n); $('newItem').focus(); });
  });

  $('editToggle').addEventListener('click', function(){
    forget(); setNote('');
  });

  $('access').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('token').value.trim(); if (!v) return;
    setNote('Проверяю PIN…');
    post({ action: 'check', pin: v }).then(function(j){
      if (!j.ok) { setNote('PIN не подошёл.', true); return; }
      pin = v; try { localStorage.setItem(KEY, v); } catch(err) {}
      $('token').value = ''; $('access').hidden = true;
      apply(j); render();
      setNote('Отметки видят все, у кого есть PIN.');
    }).catch(function(){ setNote('Не удалось проверить PIN. Попробуйте ещё раз.', true); });
  });

  render(); refresh();

  // автообновление: если на сервере новая версия страницы, перезагружаемся на неё
  function checkBuild(){
    var mine = (document.querySelector('meta[name="dela-build"]') || {}).content;
    fetch('dela.html?build=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
      var m = t.match(/name="dela-build" content="(\d+)"/);
      if (!m || m[1] === mine) return;
      var key = 'dela-reloaded-' + m[1];
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch(e) {}
      location.replace('dela.html?b=' + m[1]);
    }).catch(function(){});
  }
  checkBuild();
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkBuild(); });
  setInterval(function(){ if (!document.hidden) refresh(true); }, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(true); });
})();
</script>
</body>
</html>
