<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Дела осени</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — header with progress, list, add-row, edit access */
:root{
  --bg:#f3f4f7; --card:#ffffff; --fg:#1d2230; --muted:#6b7286; --line:#e2e5ec;
  --accent:#3d5afe; --on-accent:#ffffff; --done:#9aa1b2; --err:#c62828;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12141b; --card:#1b1e28; --fg:#e7e9f0; --muted:#8d93a6; --line:#2a2e3b;
  --accent:#8c9cff; --on-accent:#12141b; --done:#5d6375; --err:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:40px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-size:30px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;border-top:1px solid var(--line);min-height:52px}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;line-height:1.35}
li input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
li.done span{color:var(--done);text-decoration:line-through}
li span{overflow-wrap:anywhere}
li.empty{color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;flex:none}
.del:hover{background:var(--line);color:var(--fg)}
form{display:flex;gap:8px}
input.text{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn{font:inherit;font-weight:500;padding:0 18px;min-height:46px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.link{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.note.err{color:var(--err)}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.access{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.access p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
input:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Дела осени</h1>
  <div class="meta"><span id="count">Загружаю…</span><div class="bar"><i id="fill"></i></div></div>
  <ul id="list"><li class="empty">Загружаю список…</li></ul>
  <form id="add" hidden><input class="text" id="newItem" placeholder="Новое дело" autocomplete="off"><button class="btn" id="addBtn">Добавить</button></form>
  <div class="foot">
    <p class="note" id="note"></p>
    <button class="link" id="editToggle" type="button">Редактировать</button>
  </div>
  <form class="access" id="access" hidden>
    <p>Чтобы отмечать дела, вставьте ключ доступа к GitHub. Он хранится только в этом браузере.</p>
    <input class="text" id="token" type="password" placeholder="github_pat_…" autocomplete="off">
    <button class="btn" type="submit">Сохранить ключ</button>
  </form>
</div>
<script>
(function(){
  var API = 'https://api.github.com/repos/verbarius1/smart-procent/contents/dela.json';
  var KEY = 'dela-token';
  var state = { items: [] }, sha = null, token = '', busy = false, queued = false, loaded = false;
  var $ = function(id){ return document.getElementById(id); };

  try { token = localStorage.getItem(KEY) || ''; } catch(e) {}

  function setNote(t, err){ $('note').textContent = t; $('note').className = err ? 'note err' : 'note'; }
  function canEdit(){ return !!token && loaded; }

  function b64decode(s){
    var bin = atob(s.replace(/\n/g, '')), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function b64encode(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function render(){
    var list = $('list'); list.textContent = '';
    var edit = canEdit();
    if (!state.items.length && loaded) {
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = 'Список пуст.'; list.append(e);
    }
    state.items.forEach(function(it, i){
      var li = document.createElement('li'); if (it.d) li.className = 'done';
      var lab = document.createElement('label');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'c' + i; cb.checked = !!it.d; cb.disabled = !edit;
      cb.addEventListener('change', function(){ change(function(s){ var x = find(s, it.t); if (x) x.d = cb.checked; }); });
      var sp = document.createElement('span'); sp.textContent = it.t;
      lab.append(cb, sp); li.append(lab);
      if (edit) {
        var del = document.createElement('button'); del.className = 'del'; del.type = 'button'; del.textContent = '×';
        del.setAttribute('aria-label', 'Удалить «' + it.t + '»');
        del.addEventListener('click', function(){ change(function(s){ s.items = s.items.filter(function(x){ return x.t !== it.t; }); }); });
        li.append(del);
      }
      list.append(li);
    });
    var n = state.items.length, d = state.items.filter(function(x){ return x.d; }).length;
    if (loaded) $('count').textContent = 'Сделано ' + d + ' из ' + n;
    $('fill').style.width = (n ? d / n * 100 : 0) + '%';
    $('add').hidden = !edit;
    $('editToggle').textContent = token ? 'Выйти из редактирования' : 'Редактировать';
  }

  function find(s, t){ for (var i = 0; i < s.items.length; i++) if (s.items[i].t === t) return s.items[i]; return null; }

  function headers(auth){
    var h = { 'Accept': 'application/vnd.github+json' };
    if (auth && token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  function load(){
    return fetch(API + '?t=' + Date.now(), { headers: headers(true), cache: 'no-store' }).then(function(r){
      if (r.status === 401 && token) { forget(); setNote('Ключ не подошёл, введите новый.', true); return load(); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){
      if (!j) return;
      sha = j.sha; state = JSON.parse(b64decode(j.content)); loaded = true;
    });
  }

  function refresh(quiet){
    if (busy) return;
    load().then(function(){
      render();
      if (!quiet) setNote(token ? 'Отметки сохраняются для всех, у кого есть ссылка.' : 'Список обновляется сам. Отмечать может владелец.');
    }).catch(function(e){
      if (!loaded) {
        // запасной путь: копия файла на GitHub Pages
        fetch('dela.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(s){
          state = s; loaded = true; render(); setNote('Показываю сохранённую копию, свежие отметки подтянутся позже.');
        }).catch(function(){ setNote('Не удалось загрузить список. Проверьте интернет и обновите страницу.', true); });
      }
    });
  }

  // apply a change on top of the freshest version, then write it
  function change(mutate){
    mutate(state); render();
    pendingMutations.push(mutate);
    flush();
  }
  var pendingMutations = [];

  function flush(){
    if (busy) { queued = true; return; }
    if (!pendingMutations.length) return;
    busy = true; setNote('Сохраняю…');
    var muts = pendingMutations.splice(0);
    function attempt(tries){
      return load().then(function(){
        muts.forEach(function(m){ m(state); });
        var body = JSON.stringify({
          message: 'Дела осени: обновление списка',
          content: b64encode(JSON.stringify(state, null, 1) + '\n'),
          sha: sha
        });
        return fetch(API, { method: 'PUT', headers: Object.assign(headers(true), { 'Content-Type': 'application/json' }), body: body });
      }).then(function(r){
        if (r.status === 409 && tries > 0) return attempt(tries - 1);
        if (r.status === 401 || r.status === 403 || r.status === 404) { var c = r.status; forget(); throw new Error('key:' + c); }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json().then(function(j){ sha = j.content.sha; });
      });
    }
    attempt(2).then(function(){
      setNote('Сохранено. Все увидят это при открытии страницы.');
    }).catch(function(e){
      var m = String(e && e.message || e);
      if (m.indexOf('key:') === 0) setNote('Ключ не подходит для записи. Введите ключ с правом «Contents: Read and write» для smart-procent.', true);
      else setNote('Не удалось сохранить (' + m + '). Попробуйте ещё раз.', true);
      return load().catch(function(){});
    }).then(function(){
      busy = false; render();
      if (queued) { queued = false; flush(); }
    });
  }

  function forget(){ token = ''; try { localStorage.removeItem(KEY); } catch(e) {} render(); }

  $('add').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('newItem').value.trim(); if (!v) return;
    $('newItem').value = '';
    change(function(s){ if (!find(s, v)) s.items.push({ t: v, d: false }); });
  });

  $('editToggle').addEventListener('click', function(){
    if (token) { forget(); setNote('Режим просмотра.'); return; }
    $('access').hidden = !$('access').hidden;
    if (!$('access').hidden) $('token').focus();
  });

  $('access').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('token').value.trim(); if (!v) return;
    token = v; try { localStorage.setItem(KEY, v); } catch(err) {}
    $('token').value = ''; $('access').hidden = true;
    refresh();
  });

  refresh();
  setInterval(function(){ if (!document.hidden) refresh(true); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(true); });
})();
</script>
</body>
</html>
