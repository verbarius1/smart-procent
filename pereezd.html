<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Переезд: первый рейс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky progress bar, grouped tappable rows */
:root{
  --bg:#eef1f6; --card:#ffffff; --fg:#1d2433; --muted:#6b7488;
  --line:#dde2ec; --accent:#3b5bdb; --done:#2f9e6a; --done-bg:#e6f5ee;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d; --card:#1b202b; --fg:#e8ebf2; --muted:#9099ad;
  --line:#2a3140; --accent:#8fa6ff; --done:#5ccf98; --done-bg:#183027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --card:#1b202b; --fg:#e8ebf2; --muted:#9099ad;
  --line:#2a3140; --accent:#8fa6ff; --done:#5ccf98; --done-bg:#183027; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--done);border-radius:99px;transition:width .3s}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.reset.armed{border-color:#d9480f;color:#d9480f}
section{background:var(--card);border-radius:14px;padding-block:6px;overflow:hidden}
h2{font-family:var(--display);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;padding:12px 16px 6px;display:flex;justify-content:space-between}
h2 span{font-variant-numeric:tabular-nums}
label{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line);-webkit-tap-highlight-color:transparent}
label:first-of-type{border-top:none}
input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;margin:0;display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
input::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s}
input:checked{background:var(--done);border-color:var(--done)}
input:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label:has(input:checked){background:var(--done-bg)}
label:has(input:checked) .t{color:var(--muted);text-decoration:line-through}
.note{color:var(--muted);font-size:.9rem;margin:0}
section.complete h2{color:var(--done)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Переезд: первый рейс</h1>
    <p class="sub">Я и кот. Отмечайте, что уже собрано.</p>
  </header>

  <div class="bar">
    <div class="bar-row">
      <span class="count" id="count">0 из 0</span>
      <button class="reset" id="reset" type="button">Сбросить</button>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div id="list"></div>

  <p class="note">Украшения и документы — в сумку, которая всё время при вас.</p>
</div>

<script>
const groups = [
  ["Кот", ["Переноска","Лоток и наполнитель","Миски для еды и воды","Корм","Игрушки","Лежанка или плед с домашним запахом"]],
  ["Документы", ["Загран","Свидетельство о рождении","Ключ от родительской квартиры","Паспорт, карты, ключи от новой квартиры"]],
  ["Личное", ["Косметика","Украшения","Умывашки","Капа","Любимая чашка","Чашка МИФИ","Зубная щётка и паста, расчёска","Лекарства","Зарядки для телефона и ноутбука","Полароид и зарядка к нему","Электронная книга"]],
  ["Спальное", ["Подушка","Простыня","Одеяло","Наволочка и пододеяльник","Полотенца"]],
  ["Одежда", ["Бельё","Чёрный халатик","Носки","Штаны","Кофты и топы","Тапочки","Свадебное платье"]],
  ["На всякий случай", ["Мешки для мусора","Тряпка"]]
];
const KEY="pereezd-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};

const list=document.getElementById("list");
list.style.cssText="display:flex;flex-direction:column;gap:16px";
groups.forEach(([name,items],gi)=>{
  const s=document.createElement("section");
  s.innerHTML=`<h2>${name}<span></span></h2>`;
  items.forEach((it,ii)=>{
    const id=`i${gi}-${ii}`;
    const l=document.createElement("label");
    l.innerHTML=`<input type="checkbox" id="${id}"><span class="t">${it}</span>`;
    const cb=l.querySelector("input");
    cb.checked=!!state[it];
    cb.addEventListener("change",()=>{state[it]=cb.checked;save();update()});
    s.appendChild(l);
  });
  list.appendChild(s);
});

function update(){
  let all=0,done=0;
  list.querySelectorAll("section").forEach(s=>{
    const cbs=s.querySelectorAll("input"),d=[...cbs].filter(c=>c.checked).length;
    s.querySelector("h2 span").textContent=`${d}/${cbs.length}`;
    s.classList.toggle("complete",d===cbs.length);
    all+=cbs.length;done+=d;
  });
  document.getElementById("count").textContent=done===all?`Всё собрано 🎉`:`${done} из ${all}`;
  document.getElementById("fill").style.width=(done/all*100)+"%";
}
update();

const r=document.getElementById("reset");let t;
r.addEventListener("click",()=>{
  if(!r.classList.contains("armed")){r.classList.add("armed");r.textContent="Точно сбросить?";t=setTimeout(()=>{r.classList.remove("armed");r.textContent="Сбросить"},3000);return}
  clearTimeout(t);state={};save();list.querySelectorAll("input").forEach(c=>c.checked=false);
  r.classList.remove("armed");r.textContent="Сбросить";update();
});
</script>
</body>
</html>
